[project]
name = "dim-world-cooker"
version = "0.1.0"
description = "Cook GLB/OBJ models into MuJoCo-ready mesh assets for dim-world-builder"
requires-python = ">=3.11,<3.13"
dependencies = [
    "trimesh>=4.4",
    "numpy>=1.26",
    "coacd>=1.0.5",
    "scipy>=1.11",
    "pillow>=10",
    "mujoco>=3.3",
    "fast-simplification>=0.1.7",
]

[tool.uv]
package = false
