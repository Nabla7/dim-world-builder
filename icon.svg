<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="World Builder">
  <!-- dimOS app icon set v6: dark glass tile tinted to the glyph, neon gradient glyph with a soft bloom -->
  <defs>
    <radialGradient id="dwb-tile" cx=".5" cy=".18" r=".95"><stop offset="0" stop-color="#0d2a14"/><stop offset="1" stop-color="#07070f"/></radialGradient>
    <linearGradient id="dwb-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="dwb-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
    <filter id="dwb-bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <linearGradient id="dwb-a" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50"><stop offset="0" stop-color="#d4ffb8"/><stop offset="1" stop-color="#3ccf5e"/></linearGradient>
    <g id="dwb-glyph">
      <path d="M14 46H24V38H32V30H40V22H50" fill="none" stroke="url(#dwb-a)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M14 46H50V22" fill="none" stroke="url(#dwb-a)" stroke-width="2" stroke-linejoin="round" stroke-opacity=".55"/>
      <path d="M12 52C18 47 24 50 30 47C36 44 42 49 52 46" fill="none" stroke="url(#dwb-a)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="21" cy="19" r="3.4" fill="url(#dwb-a)"/></g>
    <linearGradient id="dwb-scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#e2e2e2"/><stop offset=".5" stop-color="#c2c2c2"/><stop offset=".75" stop-color="#e2e2e2"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="dwb-scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#dwb-scanrow)"/></pattern>
    <mask id="dwb-scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#dwb-scan)"/></mask>
    <filter id="dwb-core" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="erode" radius="0.9" result="e"/><feGaussianBlur in="e" stdDeviation="0.45" result="eb"/><feFlood flood-color="#fffaf0" flood-opacity=".78"/><feComposite in2="eb" operator="in" result="c"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="c"/></feMerge></filter>
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#dwb-glyph" filter="url(#dwb-bloom)"/>
    <g mask="url(#dwb-scanlines)"><use href="#dwb-glyph" filter="url(#dwb-core)"/></g>
  </g>
</svg>
