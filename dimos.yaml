# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: World Builder
spec-version: v1.2
uses:
    # viewer mode: the running simulation's TF (robot + moving objects) and lidar, through Desktop's zenoh-gateway
    "@zenoh-gateway": ">=0.5 <0.6"
# spec v1.2: the page only reads; it never publishes (no command topics)
zenoh:
    default_permission: deny
    read:
        - id: live-world
          messages: [declare_subscriber, put]
          key_exprs:
              - "dimos/**/tf2_msgs.TFMessage"
              - "dimos/**/sensor_msgs.PointCloud2"
              - "dimos/**/geometry_msgs.PoseStamped"
              - "dimos/**/sensor_msgs.JointState"
          permission: allow
        # dimos-react's app provider listens for this app's own backend events (Desktop's <namespace>/apps/<app>/frontend)
        - id: own-events
          messages: [declare_subscriber, put]
          key_exprs: ["dimos-desktop/*/apps/dim-world-builder/frontend/**"]
          permission: allow
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    description: "World Builder: makes 3D worlds (rooms, floors, stairs, hills, furniture, moving obstacles) for simulated robots and exports them for dimos sim2"
    endpoints:
        - method: POST
          path: api/export
          description: Write a world as a dimos sim2 scene folder (scene.xml, scene.json, movers.json, nav_eval.json, a Python package)
          params:
              project:
                  type: object
                  description: the world (dim-world-builder.project.v1); or give name
              name:
                  type: string
                  description: the name of a saved world to export instead of a project
              parentDir:
                  type: string
                  description: the folder to write <name>/ into (default ~/dimos_worlds)
        - method: GET
          path: api/library
          description: Every placeable 3D asset (built-in library and cooked imports) with its size and collision pieces
          role: context
        - method: GET
          path: api/projects
          description: The names of the saved worlds
          role: context
        - method: GET
          path: api/project
          description: A saved world's project (rooms, stairs, items, floors, movers, nav test) as JSON
          params:
              name:
                  type: string
                  description: the world's name
        - method: POST
          path: api/project
          description: Save (create or replace) a world project
          params:
              project:
                  type: object
                  description: the world (dim-world-builder.project.v1)
        - method: POST
          path: api/project/items
          description: "Add items to a saved world. Each item: kind (primitive|mesh|room|stairs|hill|hole|apriltag), params, and optionally name, floor, position [x,y,z], rotation [x,y,z,w], scale, mover"
          params:
              name:
                  type: string
                  description: the world's name
              items:
                  type: array
                  description: the items to add
        - method: POST
          path: api/generate
          description: Generate and save a world (playground is a big two-floor test scene; test_course, clutter_yard, empty)
          params:
              kind:
                  type: string
                  description: playground | test_course | clutter_yard | empty
              name:
                  type: string
                  description: the new world's name (optional)
              seed:
                  type: number
                  description: for playground (optional)
        - method: GET
          path: api/views
          description: A saved world's remembered camera views (key, name, eye, target, fov); each is a MuJoCo camera named by its key in the export
          role: context
          params:
              name:
                  type: string
                  description: the world's name
        - method: POST
          path: api/views
          description: Remember a camera view in a saved world (its key comes from the view's name; the same key replaces it)
          params:
              name:
                  type: string
                  description: the world's name
              view:
                  type: object
                  description: "{ name, eye: [x,y,z], target: [x,y,z], fov (vertical degrees, default 50) }"
        - method: POST
          path: api/views/remove
          description: Forget a remembered view
          params:
              name:
                  type: string
                  description: the world's name
              view:
                  type: string
                  description: the view's key
        - method: GET
          path: api/views/image
          description: A PNG of the world (as exported, rendered by MuJoCo) seen from a remembered view
          role: view
          params:
              name:
                  type: string
                  description: the world's name
              view:
                  type: string
                  description: the view's key
              width:
                  type: number
                  description: pixels (default 960, at most 1920)
              height:
                  type: number
                  description: pixels (default 540, at most 1080)
    private:
        - api/internal/*
        - files/*
