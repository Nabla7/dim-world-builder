# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: World Builder
spec-version: v1.3
uses:
    "@desktop-gateway":
        - GET /api/agent
    # viewer mode: the running simulation's TF (robot + moving objects) and lidar, through Desktop's zenoh-gateway
    "@zenoh-gateway": ">=0.5 <0.6"
# spec v1.2: the page only reads; it never publishes (no command topics)
zenoh:
    default_permission: deny
    read:
        - id: live-world
          messages: [declare_subscriber, put]
          key_exprs:
              - "dimos/**/tf2_msgs.TFMessage"
              - "dimos/**/sensor_msgs.PointCloud2"
              - "dimos/**/geometry_msgs.PoseStamped"
              - "dimos/**/sensor_msgs.JointState"
          permission: allow
        # dimos-react's app provider listens for this app's own backend events (Desktop's <namespace>/apps/<app>/frontend)
        - id: own-events
          messages: [declare_subscriber, put]
          key_exprs: ["dimos-desktop/*/apps/dim-world-builder/frontend/**"]
          permission: allow
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    openapi: 3.1.0
    info:
        title: World Builder
        version: 1.0.0
        description: >-
            World Builder: makes 3D worlds (rooms, floors, stairs, hills, furniture, moving obstacles) for simulated robots
            and exports them for dimos sim2
        x-when: you need to build a 3D world for a simulated robot or export one to dimos sim2
    x-private:
        - api/internal/*
        - files/*
    paths:
        /api/context:
            get:
                summary: Current scene review and saved World Builder projects
                description: Returns the active review revision, metric camera/object/point, saved spatial feedback, source provenance, limitations and the World Builder project list. Feedback does not imply a Blender change has been applied.
                x-when: you need the user's current scene context and spatial feedback before editing the Blender source
                x-dimos-role: context
        /api/review/bundle:
            get:
                summary: Faithful review bundle, source objects and calibrated viewpoints
                x-when: you need source object IDs, material mappings or recorded cameras
        /api/review/context:
            get:
                summary: Active review context and saved feedback
                x-when: you need the selected object, project-frame point, camera, recording and review notes
        /api/review/focus:
            post:
                summary: Share the browser's current review focus
                description: Body is a Focus record with revision, camera pose/target/FOV/aspect, sourceSecond or null, objectId or null, metric point or null, cutHeight and presentation mode. Does not change source geometry.
                x-when: you need to share the current review camera and selection
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                description: Review Focus record in original project metres and Z-up coordinates
        /api/review/view:
            get:
                summary: See the shared scene view, recording reference or attached photograph
                description: Returns an image to the agent. With noteId, uses the immutable saved view attached to the user's message; otherwise uses the latest browser capture. kind selects screenshot (default, includes drawn marks), recording (calibrated source RGB) or photo (user attachment). Camera and source-object metadata are in api/review/context. A missing image returns 404.
                x-when: you need to see the scene or reference image the user is discussing
                x-dimos-role: view
                parameters:
                    - name: noteId
                      in: query
                      schema: { type: string }
                      description: ID of the shared View N from review context; omit for the current view
                    - name: kind
                      in: query
                      schema: { type: string, enum: [screenshot, recording, photo] }
                      description: Which image to inspect; defaults to screenshot
            post:
                summary: Show a camera, shared view, floor or selected object in the user's scene
                description: Queues a view change for the open browser; check api/review/updates for applied=true. Does not edit geometry. Use sourceSecond for a recorded camera, noteId to restore a saved View N, level for a building cutaway, or objectId to highlight a source object. The scene bundle lists available cameras and object IDs.
                x-when: you want to point out something in the scene or show a reference viewpoint
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    sourceSecond: { type: number, description: Recorded camera second from the scene bundle }
                                    noteId: { type: string, description: Saved view ID from review context }
                                    level: { type: string, enum: [all, ground, upper], description: Building overview cutaway }
                                    objectId: { type: string, description: Original Blender object ID to highlight }
        /api/review/updates:
            get:
                summary: Confirm whether the browser applied an agent's view change
                x-when: you need to verify a queued view command reached the open viewer
            post:
                summary: Browser acknowledgement of a view change
                x-when: the browser has applied the queued camera or selection change
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id]
                                properties:
                                    id: { type: string, description: View command ID returned by POST api/review/view }
        /api/review/open:
            post:
                summary: Show a new Blender export or restore a previous scene revision
                description: Open a local review bundle containing scene.json, evidence.json and exported geometry. The export must retain the project ID and metric coordinate frame. Save edits as a new Blender file and export to a new directory with a unique revision name. expectedRevision protects against publishing over a newer revision. The browser reloads at the same viewpoint; check api/review/updates for applied=true. Previous revisions remain available for undo. This validates the handoff, not geometry accuracy or physics.
                x-when: you have exported a requested Blender change and want to show it, or the user asks to return to a previous revision
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [bundleDir, expectedRevision]
                                properties:
                                    bundleDir: { type: string, description: Absolute local path to an exported review bundle }
                                    expectedRevision: { type: string, description: Currently active revision from review context }
        /api/review/notes:
            get:
                summary: Saved scene review feedback
                x-when: you need unresolved or resolved feedback attached to this scene revision
            post:
                summary: Save spatial feedback with optional drawing and reference photograph
                description: Body is a Focus record plus text, normalized strokes and optional PNG/JPEG data-URL screenshot and attachment. Returns the saved note. This records a request; it does not apply Blender edits.
                x-when: you want to record a specific scene correction for the authoring agent
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                description: Focus fields plus text, strokes, optional screenshot and attachment
        /api/review/notes/status:
            post:
                summary: Resolve or reopen a saved review note
                x-when: you have reviewed a correction or want to reopen feedback
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id, status]
                                properties:
                                    id:
                                        type: string
                                        description: Saved review note UUID
                                    status:
                                        type: string
                                        enum: [open, resolved]
                                        description: Reviewed completion state; not automatic proof of an applied change
        /api/export:
            post:
                description: >-
                    Write a world as a dimos sim2 scene folder <parentDir>/<name>/ (scene.xml, scene.json, a Python package)
                    and also save the project. Returns { dir, name, files, bodies, movers, warnings }; warnings lists items
                    that clip into each other
                x-when: you want a world as a dimos sim2 scene to run in simulation
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    project:
                                        type: object
                                        description: the world (dim-world-builder.project.v1); or give name
                                    name:
                                        type: string
                                        description: the name of a saved world to export instead of a project
                                    parentDir:
                                        type: string
                                        description: the folder to write <name>/ into (default ~/dimos_worlds)
        /api/library:
            get:
                description: >-
                    Every placeable 3D asset (built-in library and cooked imports) as a JSON list, each with its id, size
                    and collision pieces
                x-when: you need the ids and sizes of the assets you can place in a world
        /api/projects:
            get:
                summary: 'The names of the saved worlds, as { projects: [name] }'
                x-when: you need to know which worlds are saved
        /api/open:
            post:
                description: >-
                    Open a world in World Builder for the user: Desktop opens (or switches to) World Builder showing it, and
                    any World Builder page already open switches to it. Give the name of a saved world, a path on this
                    machine (a project .json, an export's scene.json, or an export's folder), or a project as JSON. A
                    project file opened by path keeps saving back to that file. Returns { opened, items, savesTo?, shown,
                    note? }; shown is false when no Desktop window is open (note says why)
                x-when: you want to show the user a world, or open a world file for them to edit
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: a saved world's name (GET /api/projects lists them)
                                    path:
                                        type: string
                                        description: a file or export folder on this machine (~ allowed)
                                    project:
                                        type: object
                                        description: a dim-world-builder.project.v1 project, or an export's scene.json
                                    show:
                                        type: boolean
                                        description: open World Builder in front of the user (default true); false only switches pages already open
        /api/project:
            get:
                description: >-
                    A saved world's project (rooms, stairs, items, floors, movers, nav test) as JSON; 404 if there is no such
                    world
                x-when: you need to read the full contents of a saved world
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
            post:
                description: >-
                    Save (create or replace) a world project under its name (snake_cased). Returns { saved: name, items: count
                    }; 400 if the project is not dim-world-builder.project.v1
                x-when: you want to save a whole world you built or edited yourself
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    project:
                                        type: object
                                        description: the world (dim-world-builder.project.v1)
        /api/project/items:
            post:
                description: >-
                    Add items to a saved world. Each item: kind (primitive|mesh|room|stairs|hill|hole|apriltag|light), params,
                    and optionally name, floor (default the active floor), position [x,y,z], rotation [x,y,z,w], scale, mover.
                    Returns { added: [item id], items: count, warnings }; warnings lists items that now clip into each other
                x-when: you want to add objects, rooms, stairs or obstacles to a saved world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    items:
                                        type: array
                                        description: the items to add
        /api/generate:
            post:
                description: >-
                    Generate and save a world (playground is a big two-floor test scene; test_course, clutter_yard, empty).
                    Returns { saved: name, items: count, warnings }; warnings lists items that clip into each other
                x-when: you want a ready-made test world to start from
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    kind:
                                        type: string
                                        description: playground | test_course | clutter_yard | empty
                                    name:
                                        type: string
                                        description: the new world's name (optional)
                                    seed:
                                        type: number
                                        description: for playground (optional)
        /api/check:
            post:
                description: >-
                    Which items clip into each other: MuJoCo checks every pair of collision shapes (floors and hills excluded).
                    clips: [{a, b (key, name, kind), depth_m, at [x,y,z]}], warnings: one line each
                x-when: you need to know whether items in a world overlap
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: a saved world's name
                                    project:
                                        type: object
                                        description: a world (dim-world-builder.project.v1) instead of a saved one
                                    tolerance:
                                        type: number
                                        description: meters of overlap to ignore (default 0.02)
        /api/views:
            get:
                description: >-
                    A saved world's remembered camera views as { views: [{ key, name, eye, target, fov }] }; each is a MuJoCo
                    camera named by its key in the export
                x-when: you need the camera views remembered for a saved world
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
            post:
                description: >-
                    Remember a camera view in a saved world (its key comes from the view's name; the same key replaces it).
                    Returns { saved: key, views: count }
                x-when: you want to remember a camera angle on a saved world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    view:
                                        type: object
                                        description: '{ name, eye: [x,y,z], target: [x,y,z], fov (vertical degrees, default
                                            50) }'
        /api/views/remove:
            post:
                summary: 'Forget a remembered view of a saved world. Returns { removed: count }'
                x-when: you want to forget a remembered camera view
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    view:
                                        type: string
                                        description: the view's key
        /api/views/image:
            get:
                summary: A PNG of the world (as exported, rendered by MuJoCo) seen from a remembered view
                x-when: you want to see what a world looks like from a remembered view
                x-dimos-role: view
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
                    -   name: view
                        in: query
                        schema:
                            type: string
                        description: the view's key
                    -   name: width
                        in: query
                        schema:
                            type: number
                        description: pixels (default 960, at most 1920)
                    -   name: height
                        in: query
                        schema:
                            type: number
                        description: pixels (default 540, at most 1920)
